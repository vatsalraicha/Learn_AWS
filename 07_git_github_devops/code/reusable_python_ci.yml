# Reusable workflow — Python CI for ML repos
# Place at: capitalone/workflows-org/.github/workflows/python-ci.yml
# Consumed via:
#   jobs:
#     ci:
#       uses: capitalone/workflows-org/.github/workflows/python-ci.yml@v3
#       with:
#         python-version: "3.12"
#       secrets: inherit

name: Reusable Python CI

on:
  workflow_call:
    inputs:
      python-version:
        type: string
        required: false
        default: "3.11"
      working-directory:
        type: string
        required: false
        default: "."
      run-integration-tests:
        type: boolean
        required: false
        default: false
      coverage-threshold:
        type: number
        required: false
        default: 80
      runner:
        type: string
        required: false
        default: "ubuntu-latest"
    secrets:
      CODECOV_TOKEN:
        required: false
    outputs:
      coverage:
        description: "Test coverage percentage"
        value: ${{ jobs.test.outputs.coverage }}
      python-version:
        description: "Python version used"
        value: ${{ inputs.python-version }}

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  pre-commit:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip
      - uses: pre-commit/action@v3.0.1
        with:
          extra_args: --all-files

  test:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    outputs:
      coverage: ${{ steps.cov.outputs.coverage }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip

      - name: Install
        working-directory: ${{ inputs.working-directory }}
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Unit tests
        working-directory: ${{ inputs.working-directory }}
        run: |
          pytest tests/unit -v \
            --cov=src \
            --cov-report=xml \
            --cov-report=term \
            --junitxml=junit-unit.xml

      - name: Notebook tests
        if: hashFiles('notebooks/**/*.ipynb') != ''
        working-directory: ${{ inputs.working-directory }}
        run: |
          pip install nbmake
          pytest --nbmake notebooks/ -v --junitxml=junit-nb.xml

      - name: Integration tests
        if: inputs.run-integration-tests
        working-directory: ${{ inputs.working-directory }}
        run: pytest tests/integration -v --junitxml=junit-int.xml

      - id: cov
        working-directory: ${{ inputs.working-directory }}
        run: |
          PCT=$(python -c "
          import xml.etree.ElementTree as ET
          root = ET.parse('coverage.xml').getroot()
          rate = float(root.attrib['line-rate']) * 100
          print(f'{rate:.1f}')
          ")
          echo "coverage=$PCT" >> $GITHUB_OUTPUT
          echo "## Coverage: ${PCT}%" >> $GITHUB_STEP_SUMMARY

      - name: Coverage gate
        run: |
          python -c "
          got = ${{ steps.cov.outputs.coverage }}
          want = ${{ inputs.coverage-threshold }}
          assert got >= want, f'Coverage {got}% below threshold {want}%'
          "

      - name: Upload junit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ inputs.python-version }}
          path: ${{ inputs.working-directory }}/junit-*.xml

      - name: Upload to Codecov
        if: inputs.run-integration-tests && success()
        uses: codecov/codecov-action@v4
        with:
          files: ${{ inputs.working-directory }}/coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Publish test results comment
        if: always() && github.event_name == 'pull_request'
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: ${{ inputs.working-directory }}/junit-*.xml
