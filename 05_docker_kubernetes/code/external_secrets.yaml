# External Secrets Operator config: pull DB creds from AWS Secrets Manager via IRSA
# References: Topic 05 module 20 (Secrets), 26 (EKS data exposure).

apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-sa
  namespace: ml-serving
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/eso-ml-serving

---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secrets
  namespace: ml-serving
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef: { name: eso-sa }

---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: db-creds
  namespace: ml-serving
spec:
  refreshInterval: 1h
  secretStoreRef: { name: aws-secrets, kind: SecretStore }
  target:
    name: db-creds-k8s        # The K8s Secret name ESO creates
    template:
      type: Opaque
      data:
        DATABASE_URL: "postgres://{{ .username }}:{{ .password }}@{{ .host }}:5432/{{ .dbname }}?sslmode=require"
  data:
    - secretKey: username
      remoteRef: { key: prod/db/postgres, property: username }
    - secretKey: password
      remoteRef: { key: prod/db/postgres, property: password }
    - secretKey: host
      remoteRef: { key: prod/db/postgres, property: host }
    - secretKey: dbname
      remoteRef: { key: prod/db/postgres, property: dbname }
